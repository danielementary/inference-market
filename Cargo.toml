# Off-chain workspace. The Anchor program has its own workspace in onchain/,
# so its build never sees off-chain dependencies.
[workspace]
members = ["cli", "clients/rust", "common", "coordinator", "indexer", "worker"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
borsh = "1.5"
bs58 = "0.5"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tokio-tungstenite = "0.30"
tracing = "0.1"
tracing-subscriber = "0.3"
solana-address = "2"
solana-commitment-config = "3"
solana-keypair = "3"
solana-rpc-client = "4.3"
solana-rpc-client-api = "4.3"
solana-signature = "3"
solana-signer = "3"
solana-transaction = "4.3"
solana-transaction-status-client-types = "4.3"
common = { path = "common" }
inference-escrow-client = { path = "clients/rust" }
bytes = "1"
